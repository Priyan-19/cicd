name: Python Calculator CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: 1. Run Unit Tests (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        run: python -m pytest -v

  build:
    name: 2. Build Release Artifact (Delivery)
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Tool
        run: pip install build

      - name: Build Python Wheel Package
        run: python -m build

      - name: Upload Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: calculator-package-v1.0.0
          path: dist/
          retention-days: 7

  deploy:
    name: 3. Deploy to Production (CD)
    runs-on: ubuntu-latest
    needs: [build]
    environment: production    # Triggers manual approval and loads environment secrets!

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: calculator-package-v1.0.0
          path: release-dist/

      - name: Deploy to Production
        env:
          API_KEY: ${{ secrets.DEPLOY_API_KEY }}
        run: |
          echo "=== Starting Production Deployment ==="
          echo "Verifying downloaded package artifacts:"
          ls -la release-dist/
          echo "Authenticating deployment server with secret API Key..."
          if [ -n "$API_KEY" ]; then
            echo "API Key injected securely! (Encrypted by GitHub)"
          fi
          echo "Calculator v1.0.0 is successfully deployed to Production Live Servers! 🚀"