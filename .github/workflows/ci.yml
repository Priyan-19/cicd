name: Python Calculator CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]     # Triggers on version tags like v1.0.0, v1.0.1
  workflow_dispatch:

jobs:
  test:
    name: 1. Run Unit Tests (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        run: python -m pytest -v

  build:
    name: 2. Build Release Artifact (Delivery)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Tool
        run: pip install build

      - name: Build Python Wheel Package
        run: python -m build

      - name: Upload Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: calculator-package-v1.0.0
          path: dist/
          retention-days: 7

  deploy:
    name: 3. Deploy to Production (CD)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'   # Only run on main branch pushes
    environment: production
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: calculator-package-v1.0.0
          path: release-dist/

      - name: Deploy to Production
        env:
          API_KEY: ${{ secrets.DEPLOY_API_KEY }}
        run: |
          echo "Deploying artifact to Production..."
          ls -la release-dist/
          echo "Production deployment successful! 🚀"

  publish-docker:
    name: 4. Build & Publish Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')   # Only runs when a version tag is pushed!
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}